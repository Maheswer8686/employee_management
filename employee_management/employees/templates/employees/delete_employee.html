{% extends 'employees/base.html' %}
{% block content %}
<div class="main">
    <div class="card confirm-card">
        <div class="warning-icon">⚠</div>
        <h2 style="font-size:1.4rem; margin-bottom:0.5rem;">Are you sure?</h2>
        <p style="color:var(--text-muted); margin-bottom:1.75rem;">
            Do you really want to delete <strong>{{ employee.name }}</strong>? This action cannot be undone.
        </p>

        <form method="post" style="display:flex; justify-content:center; gap:0.75rem;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
