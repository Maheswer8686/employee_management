{% extends 'employees/base.html' %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-text">Employee Management System</div>
        </div>
        <h1 class="auth-title">Login to Your Account</h1>
        <p class="auth-subtitle">Enter your credentials to continue</p>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" style="margin-bottom:1rem;">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Username" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>

            <div class="form-group">
                <label class="checkbox-wrap">
                    <input type="checkbox" name="remember_me"> Remember me
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.7rem;">
                Login
            </button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Register</a>
        </p>
    </div>
</div>
{% endblock %}
